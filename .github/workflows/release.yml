name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag and versions
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      ocitag: ${{ steps.parse.outputs.ocitag }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and compare with project versions
        id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          re='^v([0-9]+\.[0-9]+\.[0-9]+)(-.+)?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::Tag '$tag' must look like v1.2.3 or v1.2.3-<suffix>"
            exit 1
          fi
          core="${BASH_REMATCH[1]}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then prerelease=true; else prerelease=false; fi

          # Use the full tag version for the bundle only if it is valid SemVer;
          # otherwise build with the core version.
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          version="${tag#v}"
          if [[ ! "$version" =~ $semver ]]; then
            echo "::warning::Suffix of $tag is not valid SemVer; bundling version $core"
            version="$core"
          fi

          # OCI tags allow only [A-Za-z0-9_.-], up to 128 characters.
          ocitag=$(printf '%s' "${tag}" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)

          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          for entry in "package.json=$pkg" "src-tauri/tauri.conf.json=$tauri" "src-tauri/Cargo.toml=$cargo"; do
            if [[ "${entry#*=}" != "$core" ]]; then
              echo "::error::${entry%%=*} has version ${entry#*=}, but tag $tag requires $core"
              exit 1
            fi
          done

          if [[ "$prerelease" == false ]]; then
            .github/scripts/changelog-notes.sh "$core" > /dev/null
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "ocitag=$ocitag" >> "$GITHUB_OUTPUT"

  licenses:
    name: Licenses and SBOM
    needs: prepare
    uses: ./.github/workflows/licenses.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [prepare, licenses]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows NSIS
            os: windows-latest
            bundle: nsis
            glob: src-tauri/target/release/bundle/nsis/*.exe
          # Oldest available Ubuntu runner so the AppImage stays compatible
          # with older distributions' glibc.
          - name: Linux AppImage
            os: ubuntu-22.04
            bundle: appimage
            glob: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils

      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: licenses

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build bundle
        shell: bash
        run: >-
          npx tauri build --bundles ${{ matrix.bundle }}
          --config '{"version":"${{ needs.prepare.outputs.version }}","bundle":{"resources":{"../LICENSE":"LICENSE","../licenses/THIRD-PARTY-NOTICES.md":"THIRD-PARTY-NOTICES.md"}}}'

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one artifact for ${{ matrix.glob }}, found ${#files[@]}"
            exit 1
          fi
          cp "${files[0]}" dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.bundle }}
          path: dist-release/*
          if-no-files-found: error

  # Final versions (vX.Y.Z) become GitHub Releases. The release is created as
  # a draft with the Changelog.md section as notes and must be published manually.
  release:
    name: Create draft GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installer-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/changelog-notes.sh "${{ needs.prepare.outputs.version }}" > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Trailforge ${{ needs.prepare.outputs.version }}" \
            --notes-file notes.md

  # Pre-releases (vX.Y.Z-<any suffix>) are published as GitHub Packages
  # (OCI artifacts in GHCR) and never appear under "Releases".
  package:
    name: Publish pre-release to Packages
    needs: [prepare, build]
    if: needs.prepare.outputs.prerelease == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: installer-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: assets

      - uses: oras-project/setup-oras@v1

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd assets
          oras push "ghcr.io/${repo}/installers:${{ needs.prepare.outputs.ocitag }}" \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.description=Trailforge pre-release ${{ needs.prepare.outputs.version }} (not a final release)" \
            --annotation "org.opencontainers.image.version=${{ needs.prepare.outputs.version }}" \
            ./*
