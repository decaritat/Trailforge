name: Licenses

# Generates THIRD-PARTY-NOTICES.md and SBOMs (CycloneDX) for npm and Rust
# dependencies and fails on unknown or disallowed licenses. Runs on every
# dependency change and is reused by the release workflow.
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/about.toml
      - src-tauri/about.hbs
      - .github/scripts/npm_notices.py
      - .github/workflows/licenses.yml
  workflow_call:

permissions:
  contents: read

jobs:
  notices:
    name: Third-party notices and SBOM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install license tools
        run: cargo install --locked cargo-about cargo-cyclonedx

      - name: Verify lock files are in sync
        run: |
          npm ci --ignore-scripts
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null

      - name: Generate notices
        run: |
          mkdir -p licenses
          python3 .github/scripts/npm_notices.py licenses/npm.md
          (cd src-tauri && cargo about generate --fail --locked about.hbs) > licenses/rust.md
          {
            echo "# Third-party notices"
            echo
            echo "Trailforge is licensed under GPL-3.0-or-later (see LICENSE)."
            echo "It bundles the following third-party components."
            echo
            cat licenses/npm.md
            echo
            cat licenses/rust.md
          } > licenses/THIRD-PARTY-NOTICES.md
          rm licenses/npm.md licenses/rust.md

      - name: Generate SBOMs
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > licenses/sbom-npm.cdx.json
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json \
            --spec-version 1.5 --override-filename sbom-rust.cdx
          mv src-tauri/sbom-rust.cdx.json licenses/sbom-rust.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: licenses/*
          if-no-files-found: error
